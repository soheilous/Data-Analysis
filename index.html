<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>پایش اینستاگرام</title><style>body{font:16px Tahoma;background:#f2f5fa;color:#172339;max-width:1000px;margin:40px auto;padding:20px}section,form{background:white;padding:24px;border-radius:16px;margin:20px 0}input,button{padding:10px;margin:8px;border:1px solid #bbc;border-radius:8px}button{background:#2459bc;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}a{margin:12px}</style><h1>پایش اینستاگرام</h1><p>نمونه‌کار محلی • نتایج جمع‌آوری‌شده ممکن است ناقص باشند.</p><form id="form" autocomplete="off"><label>روش جمع‌آوری <select name="method"><option value="direct">بدون مرورگر (درخواست مستقیم)</option><option value="browser">روش قبلی با مرورگر</option></select></label><fieldset id="direct-fields"><legend>ورود مستقیم — فقط در حافظه همین اجرا</legend><label>نام کاربری حساب ورود <input name="login_username" autocomplete="off"></label><label>رمز ورود <input name="login_password" type="password" autocomplete="new-password"></label><label>کد دومرحله‌ای، در صورت فعال بودن <input name="verification_code" type="password" autocomplete="off"></label><label>سقف کامنت هر پست <input name="max_comments" type="number" min="1" max="5000" value="100"></label><label>سقف لایک‌کننده هر پست <input name="max_likers" type="number" min="1" max="5000" value="100"></label><p>ورود ممکن است توسط اینستاگرام محدود شود. این روش تضمین دریافت کامل کامنت‌ها نیست؛ کد و رمز ذخیره نمی‌شوند.</p></fieldset><label>نام کاربری هدف <input name="target" required pattern="[A-Za-z0-9_.]{1,30}" placeholder="نام کاربری بدون @"></label><label>حداکثر پست <input name="max_posts" type="number" min="1" max="100" value="8"></label><label>تعداد اسکرول پروفایل (فقط روش مرورگر) <input name="scrolls" type="number" min="1" max="30" value="3"></label><label><input name="likers" type="checkbox">استخراج لایک‌کنندگان</label><label><input name="demo" type="checkbox">اجرای نمایشی بدون اینستاگرام</label><label><input name="sync" type="checkbox">کپی خروجی و بکاپ به پوشه Google Drive تنظیم‌شده</label><button>شروع اجرا</button><p id="message" role="status"></p></form><h2>اجراها، گزارش و نتایج</h2><div id="runs"></div><script>
const form=document.querySelector('form'),box=document.querySelector('#runs');form.onsubmit=async e=>{e.preventDefault();const data={target:form.elements.namedItem('target').value,max_posts:+form.max_posts.value,scrolls:+form.scrolls.value,likers:form.likers.checked,demo:form.demo.checked,sync:form.sync.checked,method:form.elements.namedItem('method').value,max_comments:+form.max_comments.value,max_likers:+form.max_likers.value,login_username:form.login_username.value,login_password:form.login_password.value,verification_code:form.verification_code.value};try{let r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){form.login_password.value='';form.verification_code.value='';document.querySelector('#message').textContent='اجرا آغاز شد'}else{const error=await r.json();document.querySelector('#message').textContent=typeof error.detail==='string'?error.detail:'ورودی‌ها را بررسی کنید'}refresh()}catch{document.querySelector('#message').textContent='ارتباط با سرور برقرار نیست'}};
let refreshVersion=0;async function refresh(){const version=++refreshVersion;try{const response=await fetch('/api/runs',{cache:'no-store'});if(!response.ok)throw new Error('دریافت اجراها ممکن نشد');const runs=await response.json();if(version!==refreshVersion)return;box.replaceChildren();for(const r of runs){const s=document.createElement('section'),h=document.createElement('h3');h.textContent=JSON.parse(r.config).target+' • '+r.status;s.append(h);const pre=document.createElement('pre');pre.textContent=r.logs;s.append(pre);for(const ext of ['csv','xlsx']){const a=document.createElement('a');a.href='/api/runs/'+r.id+'/export/'+ext;a.textContent=ext;s.append(a)}const b=document.createElement('button');b.textContent='نمایش نتایج';b.onclick=async()=>{const p=document.createElement('pre');p.textContent=JSON.stringify(await(await fetch('/api/runs/'+r.id)).json(),null,2);s.append(p);b.disabled=true};s.append(b);const clear=document.createElement('button');clear.textContent='پاک کردن نتایج';clear.style.background='#a52b36';clear.disabled=r.status==='running';clear.onclick=async()=>{if(!confirm('این اجرا با تمام نتایج، تنظیمات، گزارش و خروجی‌های CSV و Excel محلی آن پاک شود؟ نسخه‌های Drive و بکاپ‌ها حذف نمی‌شوند.'))return;clear.disabled=true;++refreshVersion;try{const response=await fetch('/api/runs/'+r.id+'/results',{method:'DELETE'});if(!response.ok){const error=await response.json();throw new Error(error.detail||'پاک کردن نتایج ممکن نشد')}++refreshVersion;s.remove();document.querySelector('#message').textContent='اجرا و نتایج محلی آن پاک شدند';await refresh()}catch(error){document.querySelector('#message').textContent=error.message;clear.disabled=false}};s.append(clear);box.append(s)}}catch{}}function methodChanged(){const direct=form.elements.namedItem('method').value==='direct';document.querySelector('#direct-fields').hidden=!direct;form.scrolls.disabled=direct;if(!direct){form.login_password.value='';form.verification_code.value=''}}form.elements.namedItem('method').onchange=methodChanged;methodChanged();refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></html>
